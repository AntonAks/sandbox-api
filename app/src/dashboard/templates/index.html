<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>sandbox-api dashboard</title>
<style>
  body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; margin: 24px; color: #222; }
  h1 { font-size: 18px; margin: 0 0 16px; }
  #meta { color: #888; font-size: 12px; margin-bottom: 12px; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: right; font-variant-numeric: tabular-nums; }
  th { background: #f5f5f5; font-weight: 600; }
  th.route { text-align: left; }
  td.route, td.status { text-align: left; font-weight: 600; background: #fafafa; }
  tr.total td, td.total { background: #eef; font-weight: 600; }
  .status-2 { color: #1a7f37; }
  .status-3 { color: #9a6700; }
  .status-4 { color: #bf3a18; }
  .status-5 { color: #b00; }
  #empty { color: #888; font-style: italic; }
  h2 { font-size: 16px; margin: 28px 0 12px; }
  td.seed-status { text-align: left; font-weight: 600; }
  .seed-ok { color: #1a7f37; }
  .seed-mismatch { color: #b00; }
  .seed-unknown { color: #888; }
  #seed-overall { margin-bottom: 12px; font-weight: 600; }
  button { font: inherit; padding: 4px 12px; cursor: pointer; }
</style>
</head>
<body>
<h1>sandbox-api — requests since start</h1>
<div id="meta">polling /dashboard/stats every 1.5s</div>
<div id="table-root"></div>

<h2>Seed data check <button id="seed-refresh" type="button">Refresh</button></h2>
<div id="seed-overall"></div>
<div id="seed-root"></div>

<script>
const POLL_MS = 1500;

function statusClass(s) {
  const n = String(s)[0];
  return "status-" + n;
}

function render(counts) {
  const root = document.getElementById("table-root");
  const routes = Object.keys(counts).sort();
  if (routes.length === 0) {
    root.innerHTML = '<div id="empty">no requests counted yet — hit some endpoints (e.g. /health/live)</div>';
    return;
  }
  const statusSet = new Set();
  for (const r of routes) for (const s of Object.keys(counts[r])) statusSet.add(s);
  const statuses = [...statusSet].sort();

  const colTotals = Object.fromEntries(routes.map(r => [r, 0]));
  const rowTotals = Object.fromEntries(statuses.map(s => [s, 0]));
  let grand = 0;
  for (const r of routes) for (const s of statuses) {
    const v = counts[r][s] || 0;
    colTotals[r] += v;
    rowTotals[s] += v;
    grand += v;
  }

  let html = "<table><thead><tr><th class='route'>status \\ route</th>";
  for (const r of routes) html += `<th>${escapeHtml(r)}</th>`;
  html += "<th class='total'>total</th></tr></thead><tbody>";
  for (const s of statuses) {
    html += `<tr><td class='status ${statusClass(s)}'>${escapeHtml(s)}</td>`;
    for (const r of routes) {
      const v = counts[r][s] || 0;
      html += `<td class='${statusClass(s)}'>${v || ""}</td>`;
    }
    html += `<td class='total'>${rowTotals[s]}</td></tr>`;
  }
  html += "<tr class='total'><td class='route'>total</td>";
  for (const r of routes) html += `<td>${colTotals[r]}</td>`;
  html += `<td>${grand}</td></tr></tbody></table>`;
  root.innerHTML = html;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[c]));
}

async function tick() {
  try {
    const r = await fetch("/dashboard/stats", { cache: "no-store" });
    if (!r.ok) return;
    render(await r.json());
  } catch (e) { /* swallow */ }
}

function fmt(n) {
  return n === null ? "—" : Number(n).toLocaleString();
}

function renderSeed(report) {
  const overall = document.getElementById("seed-overall");
  overall.className = "seed-" + report.overall_status;
  overall.textContent =
    `overall: ${report.overall_status} — ${fmt(report.total_rows)} / ${fmt(report.total_expected)} rows`;

  let html = "<table><thead><tr>"
    + "<th class='route'>table</th><th>rows</th><th>expected</th><th class='route'>status</th>"
    + "</tr></thead><tbody>";
  for (const t of report.tables) {
    html += `<tr><td class='route'>${escapeHtml(t.table)}</td>`
      + `<td>${fmt(t.rows)}</td><td>${fmt(t.expected)}</td>`
      + `<td class='seed-status seed-${t.status}'>${escapeHtml(t.status)}</td></tr>`;
  }
  html += "</tbody></table>";
  document.getElementById("seed-root").innerHTML = html;
}

async function seedTick() {
  try {
    const r = await fetch("/dashboard/seed-check", { cache: "no-store" });
    if (!r.ok) return;
    renderSeed(await r.json());
  } catch (e) { /* swallow */ }
}

document.getElementById("seed-refresh").addEventListener("click", seedTick);

tick();
setInterval(tick, POLL_MS);
seedTick();
</script>
</body>
</html>
